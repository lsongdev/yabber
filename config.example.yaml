# Yabber configuration. Only `sites` is required; everything else has
# defaults. Reload with SIGHUP.
version: 1

# Certificates are matched to sites by their DNS names. Relative paths are
# resolved against this file. With certificates or ACME and no `listeners`
# section, Yabber listens on :80 and :443 and redirects HTTP to HTTPS.
tls:
  # Listed certificates win; ACME covers every other TLS host.
  certificates:
    - cert: certs/wildcard.example.com/fullchain.pem
      key: certs/wildcard.example.com/privkey.pem
  acme:
    email: admin@example.com
    # directory: https://acme-staging-v02.api.letsencrypt.org/directory
    # Use an existing account instead of generating one:
    # account_key: acme-account.pem

# Optional. Listeners default to http on :80 (and https on :443 when any
# certificate exists).
# listeners:
#   - name: http
#     address: ":80"
#   - name: https
#     address: ":443"
#     tls: true
#     # Believe X-Forwarded-For from these peers only.
#     trusted_proxies: [10.0.0.0/8]

policies:
  - name: api
    request:
      max_body_bytes: 10485760
      timeout: 30s
    rate_limit:
      requests_per_second: 100
      burst: 200

sites:
  # One upstream for a whole site.
  - hosts: [app.example.com]
    proxy: http://127.0.0.1:3000

  # Several routes, matched with net/http ServeMux patterns.
  - hosts: [example.com, www.example.com]
    routes:
      - path: /api/
        policies: [api]
        proxy:
          upstream: http://127.0.0.1:8080
          strip_prefix: /api
      - path: /docker/
        proxy: unix:/var/run/app.sock
      - path: /healthz
        respond: ok
      - path: /
        files: /srv/www

  - hosts: [old.example.com]
    redirect:
      to: https://example.com
      preserve_path: true
